[project]
name = "ai-question-platform"
version = "0.1.0"
description = "教师出题辅助工具 demo：RAG 出题 + 规则护栏 + 分步解析"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "pydantic>=2.13",
    "langgraph>=1.0,<2.0",
    "langchain-deepseek>=1.0,<2.0",
    "qdrant-client>=1.19.0",
    "fastembed>=0.8.0",
    "sentence-transformers>=6.0.0",
    "pymupdf>=1.28.2",
    "rapidocr-onnxruntime>=1.4.4",
    "onnxruntime>=1.29.0",
    "python-multipart>=0.0.32",
    "python-docx>=1.2.0",
]

[tool.uv]
package = false
